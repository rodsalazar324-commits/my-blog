---
layout: default
title: Home
---

{% if site.show_excerpts %}

  {% for post in site.posts %}
    {% include meta.html post=post %}

    <div class="excerpt">
      {{ post.excerpt }}
    </div>

    <a class="read-more" href="{{ post.url | relative_url }}">
      Read more
    </a>

  {% endfor %}

{% else %}

  {% include_relative archive.html %}

{% endif %}
